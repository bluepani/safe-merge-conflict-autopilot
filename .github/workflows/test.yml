name: Test Safe Merge Action

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  test-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run local action
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
